name: regression
on:
  push:
  pull_request:
  workflow_dispatch:   # lets you start a run by hand from the Actions tab

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15          # matches the "under 15 minutes" goal
    steps:
      - uses: actions/checkout@v4          # the test repo

      - uses: actions/checkout@v4          # the app repo, into a folder called "app"
        with:
          repository: ctull07/TestProject
          path: app
          token: ${{ secrets.APP_REPO_TOKEN }}   # uncomment if the app repo is private

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx playwright install chromium

      - run: npm test
        env:
          APP_PROJECT: app          # folder that holds TestProject.csproj; use app/TestProject if it's in a subfolder

      - uses: actions/upload-artifact@v4
        if: always()                # upload the report even when tests fail
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/